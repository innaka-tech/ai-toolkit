name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          files=$(ls scripts/ai-* | grep -v '\.ps1$')
          shellcheck -S warning $files install.sh tests/*.sh
      - name: Syntax check
        run: for f in $(ls scripts/ai-* | grep -v '\.ps1$') install.sh tests/*.sh; do bash -n "$f"; done

  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Smoke test
        run: bash tests/smoke.sh

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Schema tests (meta-schema, positive and negative cases)
        run: cd tools/spec-check && uv run --with jsonschema --with referencing python -I test_schemas.py
      - name: Migration spec test (synthetic v1 fixture)
        run: cd tools/spec-check && uv run --with jsonschema --with pyyaml --with referencing python -I test_migration.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
