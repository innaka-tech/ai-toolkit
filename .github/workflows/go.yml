name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable  # latest patch release: stdlib security fixes
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build -o aitk-bin ./cmd/aitk
      - name: smoke
        shell: bash
        run: |
          ./aitk-bin version --json
          set +e; out=$(./aitk-bin --json nope); code=$?; set -e
          test "$code" -eq 2 && echo "$out" | grep -q E_USAGE

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable  # latest patch release: stdlib security fixes
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
