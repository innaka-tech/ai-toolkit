# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: aitk

before:
  hooks:
    - go mod tidy

builds:
  - id: aitk
    main: ./cmd/aitk
    binary: aitk
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/innaka-tech/ai-toolkit/v2/internal/cli.Version={{ .Version }}
      - -X github.com/innaka-tech/ai-toolkit/v2/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/innaka-tech/ai-toolkit/v2/internal/cli.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aitk
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "aitk_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args: ["sign-blob", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

changelog:
  disable: true # release notes come from CHANGELOG.md

release:
  github:
    owner: innaka-tech
    name: ai-toolkit
  prerelease: auto
