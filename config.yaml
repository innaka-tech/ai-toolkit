# AI Toolkit Configuration
# Providers the toolkit knows how to start (see `ai-exec`, `ai-status`).
# Model routing, cost control, and account rotation are out of scope:
# use your AI tool's or gateway's own settings for those.

providers:
  - claude
  - codex
  - opencode
  - gemini
  - hermes
  - freebuff
  - kiro
  - jcode

context_dir: ~/.ai-toolkit/context
log_dir: ~/.ai-toolkit/logs
